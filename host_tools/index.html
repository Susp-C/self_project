<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dingo Controller</title>
    <style>
        :root { --sf: 1; --cyan: #00e0c6; --pink: #ff2d78; --red: #ff3b46; }
        html, body {
            background-color: #0c0e10; color: #fff;
            font-family: 'Arial', sans-serif;
            margin: 0; padding: 0; width: 100vw; height: 100vh; height: 100dvh;
            overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none;
        }
        .panel { position: relative; width: 100%; height: 100%; box-sizing: border-box; }
        .glow {
            position: absolute; inset: 0; pointer-events: none;
            background: radial-gradient(120% 90% at 50% 122%, rgba(0,224,198,0.10), transparent 60%);
        }
        .horizon {
            position: absolute; left: 0; right: 0; height: 1px; pointer-events: none;
            background: linear-gradient(90deg, transparent, rgba(0,224,198,0.22), transparent);
        }

        /* ---------- TOP BAR ---------- */
        .topbar {
            position: absolute; top: 0; left: 0; right: 0; height: 52px; z-index: 6;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 18px; box-sizing: border-box;
            background: rgba(10,12,14,0.5); border-bottom: 1px solid rgba(255,255,255,0.06);
        }
        .brand { display: flex; align-items: center; gap: 9px; }
        .status-dot {
            width: 9px; height: 9px; border-radius: 50%;
            background: #ff3b3b; box-shadow: 0 0 8px rgba(255,59,59,0.6);
            transition: background-color .2s, box-shadow .2s;
        }
        .status-dot.online { background: var(--cyan); box-shadow: 0 0 9px var(--cyan); }
        .brand .name { font-size: 14px; font-weight: bold; letter-spacing: 1px; }
        #conn { font-size: 11px; letter-spacing: .5px; color: #ff6b6b; }

        /* AI segmented toggle */
        .aiseg {
            display: flex; border-radius: 12px; overflow: hidden;
            background: rgba(255,255,255,0.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10);
        }
        .aiseg > div {
            display: flex; align-items: center; gap: 5px; padding: 9px 12px;
            font-size: 12px; font-weight: bold; letter-spacing: .5px; color: #8fa3a0;
            cursor: pointer; transition: background-color .12s, color .12s;
        }
        #follow.lit, #dance.lit, #line.lit { background: var(--cyan); color: #052723; box-shadow: 0 0 16px rgba(0,224,198,0.5); }
        #takeover.lit { background: var(--red); color: #2a0a0d; }
        .aiseg > div.pressed { filter: brightness(1.12); }
        .aiseg .ico { font-size: 14px; line-height: 1; }
        @media (max-width: 460px) {
            .aiseg > div { padding: 7px 5px; font-size: 8px; gap: 3px; }
            .aiseg .ico { font-size: 10px; }
        }

        /* E-STOP */
        #B {
            width: 46px; height: 46px; border-radius: 50%;
            background: rgba(255,59,70,0.14); box-shadow: inset 0 0 0 2px var(--red);
            color: #ff5762; font-size: 10px; font-weight: bold; letter-spacing: .5px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
        }
        #B.pressed { background: var(--red); color: #2a0a0d; box-shadow: inset 0 0 0 2px var(--red), 0 0 14px rgba(255,59,70,0.6); }

        /* ---------- JOYSTICKS ---------- */
        .stick-wrap {
            position: absolute; bottom: calc(20px * var(--sf));
            display: flex; flex-direction: column; align-items: center; gap: 7px; z-index: 4;
        }
        .stick-wrap.left  { left:  calc(22px * var(--sf)); }
        .stick-wrap.right { right: calc(22px * var(--sf)); }
        .joystick-zone {
            width: calc(132px * var(--sf)); height: calc(132px * var(--sf));
            border-radius: 50%; position: relative; overflow: hidden;
            background: rgba(255,255,255,0.03); box-shadow: inset 0 0 0 1.5px rgba(0,224,198,0.35);
        }
        .joystick-zone::after {
            content: ''; position: absolute; inset: 18px; border-radius: 50%;
            border: 1px dashed rgba(255,255,255,0.12);
        }
        .joystick-knob {
            position: absolute; left: 25%; top: 25%; width: 50%; height: 50%;
            border-radius: 50%; background: var(--cyan);
            box-shadow: 0 0 14px rgba(0,224,198,0.5), inset 0 -3px 7px rgba(0,0,0,0.25);
            pointer-events: none; will-change: transform;
        }
        .stick-label { font-size: 10px; letter-spacing: 2px; color: var(--cyan); }

        /* ---------- CENTER: MIC + DOCK ---------- */
        @keyframes micPulse {
            0%   { box-shadow: 0 0 0 0 rgba(0,224,198,0.6), 0 0 18px rgba(0,224,198,0.55); }
            70%  { box-shadow: 0 0 0 14px rgba(0,224,198,0), 0 0 22px rgba(0,224,198,0.55); }
            100% { box-shadow: 0 0 0 0 rgba(0,224,198,0), 0 0 18px rgba(0,224,198,0.55); }
        }
        .mic-wrap {
            position: absolute; left: 50%; bottom: calc(94px * var(--sf)); transform: translateX(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 6px; z-index: 5;
        }
        #voiceBtn {
            width: 64px; height: 64px; border-radius: 50%; border: none;
            background: var(--cyan); color: #052723; font-size: 26px;
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 0 20px rgba(0,224,198,0.55); transition: transform .1s;
        }
        #voiceBtn.pressed { transform: scale(1.06); animation: micPulse 1s ease-out infinite; }
        .mic-cap { font-size: 10px; letter-spacing: 1px; color: #8a9997; }
        #voiceText { font-size: 11px; color: #9aa; height: 13px; white-space: nowrap; }
        #voiceText .rec-dot {
            display: inline-block; width: 6px; height: 6px; background: #ff3b3b;
            border-radius: 50%; margin-right: 5px; vertical-align: middle;
        }

        .dock {
            position: absolute; left: 50%; bottom: calc(20px * var(--sf)); transform: translateX(-50%);
            display: flex; gap: 8px; z-index: 5;
        }
        .dbtn {
            width: 58px; padding: 8px 0; border-radius: 12px; cursor: pointer;
            background: rgba(255,255,255,0.04); box-shadow: inset 0 0 0 1px rgba(255,255,255,0.10);
            color: #cfd6d5; font-size: 11px; font-weight: bold; letter-spacing: .5px;
            display: flex; flex-direction: column; align-items: center; gap: 3px;
        }
        .dbtn .ic { font-size: 17px; line-height: 1; }
        .dbtn.pressed { background: var(--cyan); color: #052723; box-shadow: 0 0 14px rgba(0,224,198,0.5); }
        #RB.lit { background: rgba(0,224,198,0.16); box-shadow: inset 0 0 0 1px var(--cyan); color: var(--cyan); }
        #LB.lit { background: rgba(0,224,198,0.16); box-shadow: inset 0 0 0 1px var(--cyan); color: var(--cyan); }

        @media (max-height: 400px) and (orientation: landscape) { :root { --sf: 0.82; } }
        @media (max-height: 340px) and (orientation: landscape) { :root { --sf: 0.7; } .topbar { height: 44px; } }
    </style>
</head>
<body>
    <div class="panel">
        <div class="glow"></div>
        <div class="horizon" style="top:63%;"></div>
        <div class="horizon" style="top:73%; opacity:.55;"></div>

        <!-- TOP BAR -->
        <div class="topbar">
            <div class="brand">
                <span id="status" class="status-dot"></span>
                <span class="name">DINGO</span>
                <span id="conn">OFFLINE</span>
            </div>

            <div class="aiseg">
                <div id="follow"><span class="ico">&#128064;</span>FOLLOW</div>
                <div id="dance"><span class="ico">&#127925;</span>DANCE</div>
                <div id="line"><span class="ico">&#9998;</span>LINE</div>
                <div id="takeover" class="lit"><span class="ico">&#9209;</span>AI OFF</div>
            </div>

            <div id="B">E-STOP</div>
        </div>

        <!-- LEFT STICK -->
        <div class="stick-wrap left">
            <div id="left-joystick-zone" class="joystick-zone"></div>
            <span class="stick-label" id="leftLabel">HEIGHT</span>
        </div>

        <!-- RIGHT STICK -->
        <div class="stick-wrap right">
            <div id="right-joystick-zone" class="joystick-zone"></div>
            <span class="stick-label">TURN &middot; TILT</span>
        </div>

        <!-- CENTER MIC -->
        <div class="mic-wrap">
            <div id="voiceBtn">&#127908;</div>
            <span class="mic-cap">HOLD TO SPEAK</span>
            <div id="voiceText"></div>
        </div>

        <!-- ACTION DOCK -->
        <div class="dock">
            <div id="LB" class="dbtn"><span class="ic">&#9211;</span>ENABLE</div>
            <div id="RB" class="dbtn"><span class="ic">&#127939;</span>TROT</div>
            <div id="C"  class="dbtn"><span class="ic">&#11014;</span>HOP</div>
        </div>
    </div>

    <script>
        // --- 0. CONNECTION ---
        let ws = null;
        const statusDot = document.getElementById('status');
        const connLbl   = document.getElementById('conn');

        function setConn(online, text) {
            statusDot.classList.toggle('online', online);
            if (connLbl) { connLbl.textContent = text; connLbl.style.color = online ? 'var(--cyan)' : '#ff6b6b'; }
        }

        function connect() {
            const proto = location.protocol === 'https:' ? 'wss' : 'ws';
            ws = new WebSocket(`${proto}://${location.host}/ws`);
            ws.onopen  = () => setConn(true, 'CONNECTED');
            ws.onclose = () => { setConn(false, 'RECONNECTING'); setTimeout(connect, 1000); };
            ws.onerror = () => ws.close();
            ws.onmessage = (evt) => {
                let data;
                try { data = JSON.parse(evt.data); } catch (e) { return; }
                if (data.type === 'state') applyState(data);
            };
        }
        connect();

        function send(msg) {
            if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(msg));
        }

        // --- HEARTBEAT ---
        setInterval(() => send({ type: 'heartbeat' }), 150);

        // --- 1. BUTTON INPUT ---
        const activeButtons = {};
        const allButtons = ['forward','backward','left','right','A','B','C','D','LB','RB','takeover','follow','dance','line'];
        const joystickTouchIds = new Set();

        // ENABLE/TROT lights are never guessed client-side — they only change
        // when the robot confirms its real state via a {type:'state'} message.
        // This is what makes the lit color mean "this is what the robot is
        // actually doing right now," not "what we hope happened."
        let trotLit = false;
        let armLit = false;
        function applyState(data) {
            armLit = !!data.armed;
            trotLit = !!data.trot;
            document.getElementById('LB').classList.toggle('lit', armLit);
            document.getElementById('RB').classList.toggle('lit', trotLit);
            const lbl = document.getElementById('leftLabel');
            if (lbl) lbl.textContent = trotLit ? 'MOVE' : 'HEIGHT';
        }

        function updateLatch(id) {
            const follow = document.getElementById('follow');
            const dance = document.getElementById('dance');
            const line = document.getElementById('line');
            const takeover = document.getElementById('takeover');
            if (id === 'follow' || id === 'dance' || id === 'line') {
                if (follow) follow.classList.toggle('lit', id === 'follow');
                if (dance) dance.classList.toggle('lit', id === 'dance');
                if (line) line.classList.toggle('lit', id === 'line');
                if (takeover) takeover.classList.remove('lit');
            } else if (id === 'takeover') {
                if (takeover) takeover.classList.add('lit');
                if (follow) follow.classList.remove('lit');
                if (dance) dance.classList.remove('lit');
                if (line) line.classList.remove('lit');
            }
        }

        function setButtonState(btnId, isPressed) {
            if (isPressed === !!activeButtons[btnId]) return;
            activeButtons[btnId] = isPressed;
            const el = document.getElementById(btnId);
            if (el) el.classList.toggle('pressed', isPressed);
            send({ type: 'button', id: btnId, pressed: isPressed });
            if (isPressed) updateLatch(btnId);
        }

        function releaseAll() { allButtons.forEach(id => setButtonState(id, false)); }
        window.addEventListener('blur', releaseAll);
        window.addEventListener('pagehide', releaseAll);
        document.addEventListener('visibilitychange', () => { if (document.hidden) releaseAll(); });

        // A. MOBILE MULTI-TOUCH
        function handleMobileTouches(e) {
            e.preventDefault();
            if (joystickTouchIds.size > 0) { allButtons.forEach(id => setButtonState(id, false)); return; }
            const touched = new Set();
            for (let i = 0; i < e.touches.length; i++) {
                let node = document.elementFromPoint(e.touches[i].clientX, e.touches[i].clientY);
                while (node && !allButtons.includes(node.id)) node = node.parentElement;
                if (node && allButtons.includes(node.id)) touched.add(node.id);
            }
            allButtons.forEach(id => setButtonState(id, touched.has(id)));
        }
        window.addEventListener('touchstart',  handleMobileTouches, { passive: false });
        window.addEventListener('touchmove',   handleMobileTouches, { passive: false });
        window.addEventListener('touchend',    handleMobileTouches, { passive: false });
        window.addEventListener('touchcancel', handleMobileTouches, { passive: false });

        // B. MOUSE FALLBACK
        allButtons.forEach(id => {
            const el = document.getElementById(id);
            if (!el) return;
            el.addEventListener('mousedown',  (e) => { if (e.button === 0) setButtonState(id, true); });
            el.addEventListener('mouseup',    () => setButtonState(id, false));
            el.addEventListener('mouseleave', () => setButtonState(id, false));
        });

        // C. KEYBOARD
        const keyMap = {
            'ArrowUp': 'forward', 'w': 'forward',
            'ArrowDown': 'backward', 's': 'backward',
            'ArrowLeft': 'left', 'a': 'left',
            'ArrowRight': 'right', 'd': 'right',
            '1': 'LB', '2': 'RB', '3': 'C', ' ': 'B'
        };
        window.addEventListener('keydown', e => { const id = keyMap[e.key]; if (id && !activeButtons[id]) setButtonState(id, true); });
        window.addEventListener('keyup',   e => { const id = keyMap[e.key]; if (id) setButtonState(id, false); });

        // --- 2. VOICE INPUT (Web Speech API, recognized on the phone) ---
        const voiceBtn  = document.getElementById('voiceBtn');
        const voiceText = document.getElementById('voiceText');
        const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
        const VOICE_KEYWORDS = ['hello','forward','backward','left','right','higher','lower','stop','quit'];
        let recog = null;

        if (SR) {
            recog = new SR();
            recog.lang = 'en-US';
            recog.continuous = true;
            recog.interimResults = false;
            // Ask for several hypotheses per utterance, not just the top one.
            // "higher" is often misheard as the top guess (e.g. "hire") while
            // the correct word still shows up in a lower-ranked alternative --
            // checking all of them catches it instead of silently dropping it.
            recog.maxAlternatives = 5;

            recog.onresult = (e) => {
                const result = e.results[e.results.length - 1];
                let matched = null;
                for (let i = 0; i < result.length; i++) {
                    const alt = result[i].transcript.trim().toLowerCase();
                    if (i === 0) voiceText.innerHTML = 'heard: <b style="color:#00e0c6">' + alt + '</b>';
                    for (const k of VOICE_KEYWORDS) {
                        if (alt.includes(k)) { matched = k; break; }
                    }
                    if (matched) break;
                }
                if (matched) send({ type: 'voice', text: matched });
            };
            recog.onend = () => { voiceBtn.classList.remove('pressed'); };
            recog.onerror = (e) => { voiceText.textContent = 'voice error: ' + e.error; voiceBtn.classList.remove('pressed'); };

            function startVoice() {
                try {
                    recog.start();
                    voiceBtn.classList.add('pressed');
                    voiceText.innerHTML = '<span class="rec-dot"></span>listening&hellip;';
                } catch (err) { /* already started */ }
            }
            function stopVoice() { try { recog.stop(); } catch (err) {} }

            voiceBtn.addEventListener('touchstart', (e) => { e.stopPropagation(); e.preventDefault(); startVoice(); }, { passive: false });
            voiceBtn.addEventListener('touchend',   (e) => { e.stopPropagation(); e.preventDefault(); stopVoice(); }, { passive: false });
            voiceBtn.addEventListener('touchcancel',(e) => { e.stopPropagation(); try { recog.abort(); } catch (err) {} voiceBtn.classList.remove('pressed'); voiceText.textContent = ''; }, { passive: false });

            voiceBtn.addEventListener('mousedown', startVoice);
            voiceBtn.addEventListener('mouseup',   stopVoice);
            voiceBtn.addEventListener('mouseleave', stopVoice);
        } else {
            voiceBtn.style.display = 'none';
            voiceText.textContent = 'voice not supported';
        }

        // --- 3. JOYSTICK (custom, no library) ---
        function createJoystick(zoneId, stick) {
            const zone = document.getElementById(zoneId);
            const knob = document.createElement('div');
            knob.className = 'joystick-knob';
            zone.appendChild(knob);

            let touchId = null;
            const coords = { x: 0, y: 0 };
            let streamInterval = null;

            function update(cx, cy) {
                const rect = zone.getBoundingClientRect();
                const radius = rect.width / 2;
                let dx = cx - (rect.left + radius);
                let dy = cy - (rect.top + radius);
                const dist = Math.hypot(dx, dy);
                const max = radius * 0.5;
                if (dist > max) { dx = (dx / dist) * max; dy = (dy / dist) * max; }
                knob.style.transform = `translate(${dx}px, ${dy}px)`;
                coords.x = +(dx / max).toFixed(2);
                coords.y = +(-dy / max).toFixed(2);
            }

            function begin(id, x, y) {
                if (touchId !== null) return;
                touchId = id;
                joystickTouchIds.add(id);
                update(x, y);
                streamInterval = setInterval(() => send({ type: 'joystick', stick, x: coords.x, y: coords.y }), 100);
            }

            function end() {
                joystickTouchIds.delete(touchId);
                touchId = null;
                clearInterval(streamInterval);
                coords.x = 0; coords.y = 0;
                knob.style.transform = 'translate(0, 0)';
                send({ type: 'joystick', stick, x: 0, y: 0 });
            }

            zone.addEventListener('touchstart', e => {
                if (touchId !== null) return;
                for (const t of e.changedTouches) {
                    if (zone.contains(t.target)) { begin(t.identifier, t.clientX, t.clientY); break; }
                }
            }, { passive: false });

            window.addEventListener('touchmove', e => {
                if (touchId === null) return;
                for (const t of e.changedTouches) {
                    if (t.identifier === touchId) { update(t.clientX, t.clientY); break; }
                }
            }, { passive: false });

            function onTouchEnd(e) {
                if (touchId === null) return;
                for (const t of e.changedTouches) {
                    if (t.identifier === touchId) { end(); break; }
                }
            }
            window.addEventListener('touchend',    onTouchEnd);
            window.addEventListener('touchcancel', onTouchEnd);

            zone.addEventListener('mousedown', e => { if (e.button === 0) begin('mouse', e.clientX, e.clientY); });
            window.addEventListener('mousemove', e => { if (touchId === 'mouse') update(e.clientX, e.clientY); });
            window.addEventListener('mouseup',   () => { if (touchId === 'mouse') end(); });
        }

        createJoystick('left-joystick-zone',  'left');
        createJoystick('right-joystick-zone', 'right');
    </script>
</body>
</html>
